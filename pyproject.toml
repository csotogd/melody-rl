[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melody-rl"
version = "0.1.0"
description = "Local-first experiments in verifiable-reward music post-training"
requires-python = ">=3.12"
dependencies = ["torch>=2.6,<3", "transformers>=4.51,<5", "peft>=0.15,<1", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
melody-rl = "melody_rl.cli:main"

[tool.setuptools.packages.find]
include = ["melody_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
